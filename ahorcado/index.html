<!DOCTYPE html>
<html lang="ca" dir="ltr">
    <head>
        <meta charset="utf-8">
          <!-- Favicon  -->
        <link rel="icon" type="image/png" sizes="16x16" href="img/icons8-star-16.png">
        <title>El penjat</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/penjat.css">
        <script type="text/javascript" src="js/penjat.js"></script>
         <!--Script para web analytic -->
        <script defer src="https://analytics.jose-rodriguez-blanco.es/script.js" data-website-id="1b08ecf4-5731-4d6a-91d7-d1af5d3e4a44"></script>

    </head>
    <body><!---->
        <!-- REVISION T10 (20/10/2026): la página no tenía h1; este es discreto (solo lo leen lectores de pantalla). Depende de: ahorcado/css/penjat.css (.solo-lectores) -->
        <h1 class="solo-lectores">Joc del penjat</h1>


        <div class="main_container">
            <div class="scaffold_container"><!--Contiene las imágenes-->
                <img src="img/monster0.png" alt="monstre penjat" id="monster" class="monster">
            </div>

            <div class="buttons_container"><!--Contiene la barra lateral derecha-->
                <div id="new_game" class="button new_game">
                    <span>new game</span>
                </div>

                <div id="clue" class="button clue"><!--Contiene el div con la ? -->
                    <span>?</span>
                </div>

                <div class="button lives"><!--Contiene las vidas-->
                    <span id="lives">5 LIVES LEFT</span>
                </div>
            </div>
            
            <div class="letters_container"><!--Contiene la palabra-->
                <span id="letters">______</span>
            </div>

            <div id="info" class="info">

                <div>
                    <span>
                        <span id="welcome" class="info_msg">No permetis que la massa enfurismada pengi al monstre per no
                             saber vocabulari. Ajuda'l a salvar-se!</span>
                        <span id="game_success" class="info_msg">Has salvat al monstre. Enhorabona!</span>
                        <span id="game_fail" class="info_msg">No has salvat al monstre. Llàstima!</span>
                        <button id="btn_ok" class="btn">Continuar</button>
                    </span>
                </div>
                
            </div>

        </div>
    </body>
</html>
